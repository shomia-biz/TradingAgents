name: Remote AI Trading Analysis

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "분석할 종목명 또는 티커 (예: 삼성전자, 005930.KS, NVDA, 테슬라)"
        required: true
        default: "005930.KS"
      target_date:
        description: "분석 기준일 (YYYY-MM-DD, 비워두면 오늘 날짜)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.10 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install langchain-google-genai markdown tkcalendar

      - name: AI 트레이딩 에이전트 분석 실행 (원격 헤드리스)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PYTHONIOENCODING: "utf-8"
        run: |
          TARGET_TICKER="${{ inputs.ticker }}"
          TARGET_DATE="${{ inputs.target_date }}"

          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE=$(date +%Y-%m-%d)
          fi

          echo "=========================================="
          echo "▶ 원격 분석 종목: $TARGET_TICKER"
          echo "▶ 분석 기준일: $TARGET_DATE"
          echo "=========================================="

          python run_gemini.py "$TARGET_TICKER" "$TARGET_DATE"

      - name: deep-dive-lounge 웹사이트 자동 배포 (https://deep-dive-lounge.pages.dev)
        if: success()
        env:
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "=========================================="
          echo "▶ deep-dive-lounge 웹사이트로 자동 게시 시도..."
          echo "=========================================="

          # deep-dive-lounge 저장소 클론
          if git clone https://x-access-token:${GH_PAT}@github.com/shomia-biz/deep-dive-lounge.git lounge_repo; then
            LATEST_DIR=$(ls -td reports/*/ | head -n 1)
            python export_to_lounge.py "$LATEST_DIR" "lounge_repo"

            cd lounge_repo
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/reports src/content/posts
            if git commit -m "feat(report): add AI trading report for ${{ inputs.ticker }}"; then
              git push origin main || echo "⚠️ [안내] deep-dive-lounge 푸시 권한 확인이 필요합니다."
              echo "🎉 https://deep-dive-lounge.pages.dev 에 리포트 배포 완료!"
            fi
          else
            echo "⚠️ [안내] deep-dive-lounge 저장소 접근 권한이 없어 다운로드 아티팩트로만 보관됩니다."
          fi

      - name: 생성된 리포트(HTML/MD) 다운로드용 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: trading-report-${{ inputs.ticker }}
          path: reports/
          retention-days: 30
